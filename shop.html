<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernhouse Plants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2ec; --paper:#fbfcf9; --ink:#15261c; --ink-2:#4c5d52; --line:#d5ddd3;
  --fern:#1f5a3d; --fern-2:#2f7a54; --marigold:#e2a134;
  --probe:46px;
  --serif:"Young Serif",Georgia,serif; --sans:"Work Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);padding-bottom:calc(var(--probe) + 20px)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fern-2);outline-offset:2px}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px}
.logo{font:24px var(--serif);color:var(--fern);display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:0}
.logo svg{width:28px;height:28px}
.search{flex:1;max-width:380px;margin-left:auto}
.search input{width:100%;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.tb{background:none;border:1px solid transparent;border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.tb:hover{border-color:var(--line)}
.cart-btn{background:var(--fern);color:#fff;border-color:var(--fern)}
.cart-btn:hover{background:var(--fern-2)}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--marigold);color:var(--ink);font-weight:600;font-size:13px;text-align:center}

/* hero */
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.hero{padding:48px 0 28px;display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:end}
.hero h1{font:400 clamp(38px,6vw,68px)/1.02 var(--serif);margin:0;letter-spacing:-.01em;color:var(--fern)}
.hero p{margin:0 0 8px;color:var(--ink-2);max-width:42ch}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 22px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fern);color:#fff;border-color:var(--fern)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;padding-bottom:40px}
.item{background:var(--paper);border:1px solid var(--line);border-radius:18px 18px 6px 6px;overflow:hidden;display:flex;flex-direction:column}
.art{aspect-ratio:1/1;display:grid;place-items:end center;cursor:pointer;border:0;padding:0;width:100%}
.art svg{width:78%;height:auto;display:block}
.meta{padding:14px 16px 16px;display:flex;flex-direction:column;gap:2px;flex:1}
.name{font:400 19px var(--serif);margin:0}
.latin{font-style:italic;color:var(--ink-2);font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:12px}
.price{font-weight:600}
.add{border:1px solid var(--fern);color:var(--fern);background:none;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500}
.add:hover{background:var(--fern);color:#fff}
.empty{grid-column:1/-1;color:var(--ink-2);padding:30px 0}

/* side panel */
.scrim{position:fixed;inset:0;background:rgba(21,38,28,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:var(--probe);width:min(440px,100%);background:var(--paper);z-index:11;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;visibility:hidden}
.panel.on{transform:none;visibility:visible}
.ph{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.ph h2{font:400 24px var(--serif);margin:0}
.x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;padding:4px 8px}
.pb{padding:22px;overflow:auto;flex:1}
.pf{padding:18px 22px;border-top:1px solid var(--line)}
.primary{width:100%;background:var(--fern);color:#fff;border:0;border-radius:999px;padding:12px;font-weight:600;cursor:pointer}
.primary:hover{background:var(--fern-2)}
.line{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line .mini{width:56px;height:56px;border-radius:12px;display:grid;place-items:end center;overflow:hidden}
.line .mini svg{width:80%}
.line small{color:var(--ink-2);display:block}
.rm{background:none;border:0;color:var(--ink-2);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
.total{display:flex;justify-content:space-between;font-weight:600;margin:14px 0 4px}
.detail-art{border-radius:18px;display:grid;place-items:end center;aspect-ratio:1/1;margin-bottom:16px}
.detail-art svg{width:70%}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:14px 0 0}
.facts dt{color:var(--ink-2)}
.facts dd{margin:0}
label{display:block;font-size:14px;color:var(--ink-2);margin:12px 0 4px}
.field{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.done{text-align:center;padding:30px 10px}
.done h3{font:400 30px var(--serif);color:var(--fern);margin:10px 0 6px}

/* analytics strip: a developer overlay, deliberately not part of the shop's look */
.probe{position:fixed;left:0;right:0;bottom:0;height:var(--probe);z-index:20;background:#13201a;color:#cfe3d6;font:13px/1.4 ui-monospace,Menlo,monospace;display:flex;align-items:center;gap:14px;padding:0 16px;border-top:3px solid var(--marigold)}
.probe b{color:#fff;font-weight:600}
.probe .feed{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.probe .ok{color:#7fd69a} .probe .bad{color:#ff9a8a}
.probe label{margin:0;color:inherit;font-size:13px;display:flex;gap:6px;align-items:center}
.probe select,.probe a{background:#1f3027;color:#cfe3d6;border:1px solid #33493c;border-radius:6px;padding:3px 6px;font:inherit;text-decoration:none}
.probe .pulse{width:9px;height:9px;border-radius:50%;background:#56645b;flex:none}
.probe .pulse.go{background:var(--marigold);animation:ping .6s ease-out}
@keyframes ping{from{box-shadow:0 0 0 0 rgba(226,161,52,.8)}to{box-shadow:0 0 0 10px rgba(226,161,52,0)}}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding-top:28px;gap:10px}
  .top-in{flex-wrap:wrap;gap:10px}
  .search{order:3;max-width:none;flex-basis:100%}
  .probe .hide-sm{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <button class="logo" id="home" aria-label="Fernhouse home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 29V12" stroke="#1f5a3d" stroke-width="2" fill="none"/><path d="M16 14c-6 0-9-4-9-9 6 0 9 4 9 9zM16 19c5 0 8-3 8-8-5 0-8 3-8 8z" fill="#2f7a54"/></svg>
      Fernhouse
    </button>
    <div class="search"><input id="q" type="search" placeholder="Search plants" aria-label="Search plants"></div>
    <button class="tb" id="acct">Sign in</button>
    <button class="tb cart-btn" id="cartBtn">Basket<span class="count" id="count">0</span></button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Plants that forgive a missed watering.</h1>
    <p>Hardy, good-looking houseplants, potted and delivered. Every plant comes with a care card that fits on the fridge.</p>
  </section>
  <div class="filters" role="group" aria-label="Filter plants">
    <button class="chip" aria-pressed="true" data-f="all">All plants</button>
    <button class="chip" aria-pressed="false" data-f="low">Low light</button>
    <button class="chip" aria-pressed="false" data-f="bright">Bright light</button>
    <button class="chip" aria-pressed="false" data-f="pet">Pet safe</button>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-modal="true" role="dialog" aria-labelledby="ptitle">
  <div class="ph"><h2 id="ptitle"></h2><button class="x" id="close" aria-label="Close">&times;</button></div>
  <div class="pb" id="pbody"></div>
  <div class="pf" id="pfoot"></div>
</aside>

<div class="probe" role="status" aria-live="polite">
  <span class="pulse" id="pulse"></span>
  <span class="hide-sm"><b>Analytics</b></span>
  <span class="feed" id="feed">Every click here is sent to the Producer as an event.</span>
  <label class="hide-sm">device
    <select id="dev" aria-label="Customer device"><option value="auto">auto</option><option>mobile</option><option>desktop</option></select>
  </label>
  <a href="/" target="_top" class="hide-sm">Dashboard</a>
</div>

<script>
/* ---------- tiny analytics SDK ----------
   track(eventType) posts {eventType,userId,userName,deviceType,browser,timestamp}
   to /api/produce, which forwards it to the Producer with this app's JWT. */
const store = {
  get(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} },
  del(k){ try { sessionStorage.removeItem(k); } catch(e){} }
};
const guestId = store.get("guestId") || ("guest-" + Math.random().toString(36).slice(2,7));
store.set("guestId", guestId);
let user = null;
try { user = JSON.parse(store.get("user") || "null"); } catch(e) {}

function browserName(){
  const ua = navigator.userAgent;
  if (/Edg\//.test(ua)) return "edge";
  if (/Firefox\//.test(ua)) return "firefox";
  if (/Chrome\//.test(ua)) return "chrome";
  if (/Safari\//.test(ua)) return "safari";
  return "other";
}
function deviceType(){
  const pick = document.getElementById("dev").value;
  if (pick !== "auto") return pick;
  return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth < 700 ? "mobile" : "desktop";
}
async function track(eventType, detail){
  const ev = {eventType, userId: user ? user.id : guestId, userName: user ? user.name : "Guest",
              deviceType: deviceType(), browser: browserName(), timestamp: Date.now()};
  const p = document.getElementById("pulse"); p.classList.remove("go"); void p.offsetWidth; p.classList.add("go");
  const feed = document.getElementById("feed");
  try {
    const r = await fetch("/api/produce", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(ev)});
    feed.innerHTML = `<span class="${r.ok?"ok":"bad"}">${r.ok?"sent":"failed "+r.status}</span> <b></b> <span class="d"></span>`;
    feed.querySelector("b").textContent = eventType;
    feed.querySelector(".d").textContent = `${detail ? detail+" · " : ""}${ev.userId} · ${ev.deviceType} · ${ev.browser}`;
  } catch(e) {
    feed.innerHTML = '<span class="bad">failed</span> The Producer is not reachable. Is ./start.sh running?';
  }
}

/* ---------- catalogue ---------- */
const P = [
  {id:"monstera", name:"Swiss cheese plant", latin:"Monstera deliciosa", price:38, light:"bright", pet:false, pot:"#c9784f", bg:"#e3ece0", leaf:"#2f7a54", shape:"split", care:"Water when the top 5 cm of soil is dry."},
  {id:"snake", name:"Snake plant", latin:"Dracaena trifasciata", price:24, light:"low", pet:false, pot:"#2f3e46", bg:"#e9e7dc", leaf:"#4f7d3a", shape:"blade", care:"Every 3 weeks is plenty. Neglect suits it."},
  {id:"pothos", name:"Golden pothos", latin:"Epipremnum aureum", price:18, light:"low", pet:false, pot:"#e2a134", bg:"#e5ede8", leaf:"#6a9a3a", shape:"trail", care:"Water weekly; trim to keep it bushy."},
  {id:"calathea", name:"Prayer plant", latin:"Goeppertia orbifolia", price:32, light:"low", pet:true, pot:"#e8e2d0", bg:"#dfe9e4", leaf:"#3d7a5c", shape:"round", care:"Keep soil lightly moist; it likes humidity."},
  {id:"fig", name:"Fiddle-leaf fig", latin:"Ficus lyrata", price:56, light:"bright", pet:false, pot:"#9b5a3c", bg:"#e7ebdf", leaf:"#2a6b45", shape:"tall", care:"Bright spot, and don't move it around."},
  {id:"spider", name:"Spider plant", latin:"Chlorophytum comosum", price:16, light:"bright", pet:true, pot:"#5b7f95", bg:"#e6eee6", leaf:"#7aa84a", shape:"blade", care:"Water weekly. Pot up the babies it throws out."},
  {id:"zz", name:"ZZ plant", latin:"Zamioculcas zamiifolia", price:29, light:"low", pet:false, pot:"#d9d3c3", bg:"#e2e9e2", leaf:"#2e6b3c", shape:"tall", care:"Monthly watering. Thrives on being ignored."},
  {id:"peperomia", name:"Baby rubber plant", latin:"Peperomia obtusifolia", price:21, light:"bright", pet:true, pot:"#e07b6a", bg:"#e7ede4", leaf:"#3f8a4f", shape:"round", care:"Let it dry out between waterings."}
];

function plantSVG(p){
  const L = p.leaf;
  const pot = `<path d="M62 150h76l-8 46H70z" fill="${p.pot}"/><rect x="56" y="140" width="88" height="14" rx="3" fill="${p.pot}" opacity=".85"/>`;
  const shapes = {
    split:`<path d="M100 142V80" stroke="${L}" stroke-width="4"/><path d="M100 92c-30-2-50-22-48-50 26 0 46 20 48 50z" fill="${L}"/><path d="M100 100c28-6 44-30 38-58-26 4-42 28-38 58z" fill="${L}" opacity=".85"/><path d="M100 120c-22 4-42-6-50-26 22-6 42 4 50 26z" fill="${L}" opacity=".7"/><path d="M70 60l10 8M64 74l12 4M124 58l-10 10M130 72l-12 6" stroke="#fff" stroke-width="3" opacity=".5"/>`,
    blade:`<path d="M90 142c-10-40-6-80 4-110 8 30 8 70 2 110z" fill="${L}"/><path d="M104 142c2-44 10-76 26-96 2 36-8 70-20 96z" fill="${L}" opacity=".85"/><path d="M84 142c-16-28-24-56-20-84 14 22 22 52 24 84z" fill="${L}" opacity=".7"/>`,
    trail:`<path d="M100 140c-10-30-4-50 10-60" stroke="${L}" stroke-width="3" fill="none"/><ellipse cx="112" cy="78" rx="14" ry="10" fill="${L}"/><ellipse cx="88" cy="96" rx="13" ry="9" fill="${L}" opacity=".85"/><path d="M140 148c14 10 18 30 10 46" stroke="${L}" stroke-width="3" fill="none"/><ellipse cx="152" cy="170" rx="10" ry="7" fill="${L}"/><ellipse cx="148" cy="192" rx="9" ry="6" fill="${L}" opacity=".8"/><ellipse cx="118" cy="112" rx="12" ry="9" fill="${L}" opacity=".7"/>`,
    round:`<path d="M100 142V96" stroke="${L}" stroke-width="3"/><circle cx="100" cy="82" r="26" fill="${L}"/><circle cx="70" cy="106" r="20" fill="${L}" opacity=".8"/><circle cx="130" cy="108" r="21" fill="${L}" opacity=".85"/><path d="M84 70c10 6 22 6 32 0M58 104c8 4 16 4 24 0" stroke="#fff" stroke-width="2.5" opacity=".45" fill="none"/>`,
    tall:`<path d="M100 142V30" stroke="#6b4a32" stroke-width="5"/><ellipse cx="82" cy="46" rx="18" ry="12" fill="${L}" transform="rotate(-25 82 46)"/><ellipse cx="120" cy="62" rx="18" ry="12" fill="${L}" transform="rotate(25 120 62)" opacity=".85"/><ellipse cx="80" cy="84" rx="18" ry="12" fill="${L}" transform="rotate(-25 80 84)" opacity=".8"/><ellipse cx="122" cy="104" rx="17" ry="11" fill="${L}" transform="rotate(25 122 104)"/><ellipse cx="100" cy="28" rx="10" ry="14" fill="${L}"/>`
  };
  return `<svg viewBox="0 0 200 200" aria-hidden="true">${shapes[p.shape]}${pot}</svg>`;
}

/* ---------- state ---------- */
let cart = [];
try { cart = JSON.parse(store.get("cart") || "[]"); } catch(e) {}
let filter = "all", query = "";
const $ = id => document.getElementById(id);
const money = n => "$" + n.toFixed(2);
const find = id => P.find(p => p.id === id);
const esc = s => s.replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
function saveCart(){ store.set("cart", JSON.stringify(cart)); $("count").textContent = cart.reduce((s,l)=>s+l.qty,0); }
const cartTotal = () => cart.reduce((s,l)=>s+find(l.id).price*l.qty,0);

function render(){
  const list = P.filter(p => (filter==="all" || (filter==="pet" ? p.pet : p.light===filter))
    && (!query || (p.name+" "+p.latin).toLowerCase().includes(query)));
  $("grid").innerHTML = list.length ? "" : `<p class="empty">No plants match “${esc(query)}”. Try a shorter search or another filter.</p>`;
  list.forEach(p => {
    const el = document.createElement("article"); el.className = "item";
    el.innerHTML = `<button class="art" style="background:${p.bg}" aria-label="View ${p.name}">${plantSVG(p)}</button>
      <div class="meta"><h3 class="name">${p.name}</h3><span class="latin">${p.latin}</span>
      <div class="row"><span class="price">${money(p.price)}</span><button class="add">Add to basket</button></div></div>`;
    el.querySelector(".art").onclick = () => openProduct(p.id);
    el.querySelector(".add").onclick = () => addToCart(p.id);
    $("grid").appendChild(el);
  });
}

/* ---------- side panel ---------- */
let lastFocus = null;
function openPanel(title, body, foot){
  if (!$("panel").classList.contains("on")) lastFocus = document.activeElement;
  $("ptitle").textContent = title; $("pbody").innerHTML = body; $("pfoot").innerHTML = foot || "";
  $("pfoot").style.display = foot ? "" : "none";
  $("panel").classList.add("on"); $("scrim").classList.add("on"); $("close").focus();
}
function closePanel(){
  $("panel").classList.remove("on"); $("scrim").classList.remove("on");
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
$("close").onclick = closePanel; $("scrim").onclick = closePanel;
addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });

function openProduct(id){
  const p = find(id);
  openPanel(p.name, `<div class="detail-art" style="background:${p.bg}">${plantSVG(p)}</div>
    <p class="latin" style="margin:0">${p.latin}</p>
    <dl class="facts"><dt>Light</dt><dd>${p.light==="low"?"Copes with low light":"Wants bright, indirect light"}</dd>
    <dt>Pets</dt><dd>${p.pet?"Safe for cats and dogs":"Keep away from pets"}</dd><dt>Care</dt><dd>${p.care}</dd></dl>`,
    `<button class="primary" id="padd">Add to basket · ${money(p.price)}</button>`);
  $("padd").onclick = () => { addToCart(id); closePanel(); };
  track("view_product", p.name);
}
function addToCart(id){
  const l = cart.find(l => l.id === id); l ? l.qty++ : cart.push({id, qty:1});
  saveCart(); track("add_to_cart", find(id).name);
}
function openCart(){
  if (!cart.length) {
    openPanel("Your basket", `<p>Your basket is empty. Pick a plant to get started.</p>`);
  } else {
    openPanel("Your basket", cart.map(l => { const p = find(l.id); return `<div class="line"><div class="mini" style="background:${p.bg}">${plantSVG(p)}</div>
      <div>${p.name}<small>${l.qty} × ${money(p.price)}</small></div><button class="rm" data-id="${p.id}">Remove</button></div>`; }).join("")
      + `<div class="total"><span>Total</span><span>${money(cartTotal())}</span></div><small style="color:var(--ink-2)">Free delivery on every order.</small>`,
      `<button class="primary" id="checkout">Check out</button>`);
    $("pbody").querySelectorAll(".rm").forEach(b => b.onclick = () => {
      cart = cart.filter(l => l.id !== b.dataset.id); saveCart(); track("remove_from_cart", find(b.dataset.id).name); openCart();
    });
    $("checkout").onclick = checkout;
  }
  track("view_cart");
}
function checkout(){
  if (!user) { signIn(true); return; }
  openPanel("Check out", `<label for="addr">Delivery address</label><input class="field" id="addr" value="12 Elm Street, Harrisburg, PA">
    <label for="card">Payment</label><input class="field" id="card" value="Demo card: no real payment is taken" readonly>`,
    `<button class="primary" id="pay">Place order · ${money(cartTotal())}</button>`);
  track("begin_checkout");
  $("pay").onclick = () => {
    const n = cart.reduce((s,l)=>s+l.qty,0), total = cartTotal();
    track("purchase", `${n} item${n>1?"s":""} · ${money(total)}`);
    cart = []; saveCart();
    openPanel("Order placed", `<div class="done"><svg viewBox="0 0 32 32" width="56" height="56" aria-hidden="true"><path d="M16 29V12" stroke="#1f5a3d" stroke-width="2" fill="none"/><path d="M16 14c-6 0-9-4-9-9 6 0 9 4 9 9zM16 19c5 0 8-3 8-8-5 0-8 3-8 8z" fill="#2f7a54"/></svg>
      <h3>Thanks, ${esc(user.name)}.</h3><p>Your plants ship tomorrow. This is a demo shop, so nothing was charged.</p></div>`,
      `<button class="primary" id="more">Keep shopping</button>`);
    $("more").onclick = closePanel;
  };
}

/* ---------- account ---------- */
function signIn(thenCheckout){
  openPanel("Sign in", `<p style="margin-top:0">Pick a name to shop as. Each name counts as a different customer in the report.</p>
    <label for="nm">Name</label><input class="field" id="nm" value="Rakshit" autocomplete="off">
    <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="newacct"> This is a new account</label>`,
    `<button class="primary" id="go">Sign in</button>`);
  const go = () => {
    const name = $("nm").value.trim() || "Guest";
    user = {name, id: "u-" + (name.toLowerCase().replace(/[^a-z0-9]+/g,"-") || "guest")};
    store.set("user", JSON.stringify(user)); paintAcct();
    track($("newacct").checked ? "signup" : "login", name);
    thenCheckout ? checkout() : closePanel();
  };
  $("go").onclick = go; $("nm").onkeydown = e => { if (e.key === "Enter") go(); };
  setTimeout(() => $("nm").select(), 50);
}
function paintAcct(){ $("acct").textContent = user ? `Sign out ${user.name}` : "Sign in"; }
$("acct").onclick = () => {
  if (user) { track("logout", user.name); user = null; store.del("user"); paintAcct(); }
  else signIn(false);
};

/* ---------- wiring ---------- */
$("cartBtn").onclick = openCart;
$("home").onclick = () => { filter="all"; query=""; $("q").value=""; setChips(); render(); scrollTo(0,0); track("page_view", "home"); };
function setChips(){ document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.f===filter)); }
document.querySelectorAll(".chip").forEach(c => c.onclick = () => { filter = c.dataset.f; setChips(); render(); track("filter", c.textContent); });
let qt;
$("q").oninput = e => { query = e.target.value.trim().toLowerCase(); render(); clearTimeout(qt); if (query) qt = setTimeout(() => track("search", query), 700); };

paintAcct(); saveCart(); render(); track("page_view", "home");
</script>
</body>
</html>
